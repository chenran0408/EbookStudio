name: Upload verified v0.9.0 Windows ZIP
on:
  push:
    branches: [publish/verified-v0.9.0-761d1738]
permissions:
  contents: write
jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.0'
          architecture: x64
      - name: Restore tested archive, verify SHA-256 and send to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: chenran0408/EbookStudio
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location -LiteralPath $env:RUNNER_TEMP
          $base = 'EbookStudio-v0.8.0-Windows-x64.zip'
          $target = 'EbookStudio-v0.9.0-Windows-x64.zip'
          gh release download v0.8.0 --pattern $base
          if ((Get-FileHash -LiteralPath $base).Hash -ne '6a9aecc194c929fe7a845eff9b7c3c4f1cacf3d8c6d97493eb91b896c815ad4e') {
              throw 'Previous release differs'
          }
          python "$env:GITHUB_WORKSPACE/transfer/restore.py" $base "$env:GITHUB_WORKSPACE/transfer/update.delta" $target
          if ((Get-FileHash -LiteralPath $target).Hash -ne '761d17383d9cb1dfeb1b82496158d137338df0c9de6be34daad43cfb384f1cbb') {
              throw 'Restored ZIP differs from the local tested package'
          }
          $assets = gh release view v0.9.0 --json isDraft,assets | ConvertFrom-Json
          if (-not $assets.isDraft) { throw 'Target release must be a draft' }
          if ($target -notin $assets.assets.name) {
              gh release upload v0.9.0 $target
          }


